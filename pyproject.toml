[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lobtrade"
version = "0.1.0"
description = "Profitability labeling and prediction on crypto limit order book snapshots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebooks = ["jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
